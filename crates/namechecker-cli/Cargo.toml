[package]
name = "namechecker-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "CLI frontend for CJK cross-platform filename and folder checker"

[[bin]]
name = "namechecker"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
namechecker-core = { path = "../namechecker-core" }

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
serde_json = "1.0.154"
tempfile = "3.27.0"
