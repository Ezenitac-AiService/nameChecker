[package]
name = "namechecker-core"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description.workspace = true

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
chardetng = "1.0.0"
csv = "1.4.0"
encoding_rs = "0.8.44"
globset = "0.4.21"
icu_collator = { version = "2.4", default-features = false, features = ["serde"] }
icu_locale_core = "2.4"
icu_normalizer = { version = "2.4", features = ["serde"] }
icu_provider = { version = "2.4", features = ["sync"] }
icu_provider_blob = { version = "2.4", features = ["alloc"] }
libc = "0.2.191"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
uuid = { version = "1.29.2", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Security",
    "Win32_Storage_FileSystem",
] }

[build-dependencies]
encoding_rs = "0.8.44"

[dev-dependencies]
tempfile = "3.27.0"
